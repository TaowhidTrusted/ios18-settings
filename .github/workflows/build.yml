name: Build Tweak & Deploy Sileo APT Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $HOME/theos/sdks
          mv sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/ 2>/dev/null || true

      - name: Compile Rootless .deb
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make package FINALPACKAGE=1

      - name: Build APT Repo for Sileo
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          cat << 'EOF' > Release
          Origin: iOS 18 Morph Repo
          Label: iOS 18 Morph
          Suite: stable
          Version: 1.0
          Codename: iphoneos-arm64
          Architectures: iphoneos-arm64
          Components: main
          Description: iOS 18 Morph Rootless Tweak Repository for Sileo
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
