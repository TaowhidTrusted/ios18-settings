name: Build Tweak & Deploy Sileo APT Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $HOME/theos/sdks
          cp -r sdks-master/*.sdk $HOME/theos/sdks/ 2>/dev/null || true

      - name: Compile Rootless .deb
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make package FINALPACKAGE=1

      - name: Build APT Repo & Web Landing for Sileo
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cd repo
          
          # Create index for Sileo/Zebra
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          
          cat << 'EOF' > Release
          Origin: iOS 18 Morph Repo
          Label: iOS 18 Morph
          Suite: stable
          Version: 1.0
          Codename: iphoneos-arm64
          Architectures: iphoneos-arm64
          Components: main
          Description: iOS 18 Morph Rootless Tweak Repository for Sileo
          EOF

          # Create index.html so browsers don't show 404
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>iOS 18 Morph - Sileo Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #09090b; color: #f4f4f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
              .card { background: #18181b; border: 1px solid #27272a; border-radius: 24px; padding: 32px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
              .icon { width: 64px; height: 64px; border-radius: 16px; background: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 32px; }
              h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #ffffff; }
              p { font-size: 13px; color: #a1a1aa; line-height: 1.6; margin: 0 0 24px; }
              .btn { display: block; width: 100%; padding: 14px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 14px; box-sizing: border-box; margin-bottom: 10px; transition: background 0.2s; }
              .btn:hover { background: #1d4ed8; }
              .btn-sub { background: #27272a; color: #e4e4e7; }
              .btn-sub:hover { background: #3f3f46; }
              .url-box { background: #09090b; border: 1px solid #27272a; border-radius: 12px; padding: 10px; font-family: monospace; font-size: 11px; color: #34d399; word-break: break-all; margin-top: 16px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="icon">✨</div>
              <h1>iOS 18 Morph Repository</h1>
              <p>Rootless iOS 16 tweak bringing iOS 18 continuous squircle platters and circular Control Center toggles to your iPhone.</p>
              <a href="sileo://source/https://taowhidtrusted.github.io/ios18-settings/" class="btn">Add to Sileo</a>
              <a href="zbra://sources/add/https://taowhidtrusted.github.io/ios18-settings/" class="btn btn-sub">Add to Zebra</a>
              <div class="url-box">https://taowhidtrusted.github.io/ios18-settings/</div>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
